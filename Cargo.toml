[package]
name = "p2p-sender-relay"
version = "1.1.0"
description = "Relay, address directory and tunnel to iroh's relays for P2P Share, served over plain HTTP behind a reverse proxy"
authors = ["lamzii"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "p2p-relay"
path = "src/main.rs"

[dependencies]
iroh-relay = { version = "1.3", features = ["server"] }
iroh-dns = "1.3"
iroh-base = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
# The tunnel (WebSocket) and the upstream directory (HTTPS).
tokio-websockets = { version = "0.13", default-features = false, features = ["server"] }
n0-future = "0.3"
sha1 = "0.11"
data-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
iroh = "1.3"
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "getrandom", "rand", "sha1_smol"] }
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
